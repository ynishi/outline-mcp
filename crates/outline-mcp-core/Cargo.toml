[package]
name = "outline-mcp-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Domain, application, and infrastructure logic for outline-mcp (pure SDK crate, no MCP transport dependency)"
keywords = ["mcp", "outline", "checklist", "tree"]
categories = ["command-line-utilities"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
ai-store-core = "0.9"
ai-store-sqlite = "0.9"
ai-store-sync = "0.9"
json-patch = "4"
tokio = { version = "1", features = ["rt", "sync", "fs"] }
async-trait = "0.1"
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "migrate",
    "macros",
    "json",
    "uuid",
] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
proptest = "1"
tempfile = "3"
ai-store-mem = "0.9"
