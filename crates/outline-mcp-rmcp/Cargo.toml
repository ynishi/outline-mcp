[package]
name = "outline-mcp-rmcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "rmcp (MCP) interface layer for outline-mcp: ServerHandler, tool_router, and stdio / streamable HTTP transport wiring over outline-mcp-core"
keywords = ["mcp", "outline", "checklist", "tree"]
categories = ["command-line-utilities"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
outline-mcp-core = { path = "../outline-mcp-core", version = "0.15.1" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
rmcp = { version = "1.7", features = [
    "server",
    "transport-io",
    "macros",
    "transport-streamable-http-server",
] }
axum = "0.8"
similar = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Already in the tree through sqlx; used to decode HTTP Basic credentials for /ui.
base64 = "0.22"
tokio = { version = "1", features = ["sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
