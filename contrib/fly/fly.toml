# fly.toml — host outline-mcp on Fly.io Machines.
#
# The server keeps no state of its own: books, history and snapshots live in
# Postgres, here an unmanaged Fly Postgres app in the same org, reached over
# the private network. So the machine has no volume and may stop when idle.
#
# Usage (from the repo root — the Dockerfile is auto-detected there):
#   fly deploy --config contrib/fly/fly.toml
#
# Full walkthrough (database, secrets, migration, smoke):
#   docs/runbooks/fly-io-deploy.md
#
# Secrets the server reads (set with `fly secrets`, never here):
#   OUTLINE_MCP_DATABASE_URL  set by
#                             `fly postgres attach --app <app> --variable-name OUTLINE_MCP_DATABASE_URL <app>-db`
#   OUTLINE_MCP_HTTP_TOKEN    required for the non-loopback bind below
#
# `app` is a placeholder — create your own app first:
#   fly apps create <your-app-name>
app = "outline-mcp-server"
primary_region = "nrt"

[processes]
  # TLS terminates at the Fly edge, so the container speaks plain HTTP.
  # The server refuses to start without OUTLINE_MCP_DATABASE_URL or on a
  # database `outline-mcp migrate` has not brought up to date.
  app = "--mcp-http --bind 0.0.0.0:8486"

[http_service]
  processes = ["app"]
  internal_port = 8486
  force_https = true
  # Stateless: every write is one database transaction with a per-book
  # version check, so the machine can stop when idle and start on the next
  # request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
